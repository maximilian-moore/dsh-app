<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DSH Remote">
  <title>DSH Remote</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/mobile/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/mobile/icons/icon-192.svg">
  <link rel="stylesheet" href="/mobile/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <header class="app-header">
      <button id="btn-toggle-sessions" class="icon-btn" aria-label="Sessions menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="header-title">
        <span class="app-name">DSH Remote</span>
        <span id="session-title" class="sub-title">Connecting...</span>
      </div>
      <div class="header-status">
        <span id="status-badge" class="status-indicator online" title="Connected"></span>
      </div>
    </header>

    <div id="sessions-drawer" class="drawer hidden">
      <div class="drawer-header">
        <h2>Sessions</h2>
        <button id="btn-close-drawer" class="icon-btn" aria-label="Close drawer">✕</button>
      </div>
      <div class="drawer-actions">
        <button id="btn-new-session" class="btn btn-primary">+ New Session</button>
      </div>
      <div id="sessions-list" class="sessions-list">
        <div class="loading-placeholder">Loading sessions...</div>
      </div>
    </div>

    <main id="chat-stream" class="chat-stream">
      <div class="welcome-card">
        <h3>DSH Mobile Control</h3>
        <p>Connected securely via Tailscale.</p>
        <p class="hint">Select a session from the menu or start a new prompt.</p>
      </div>
    </main>

    <footer class="input-dock">
      <div class="dock-container">
        <textarea id="prompt-input" rows="1" placeholder="Send a instruction..." enterkeyhint="send"></textarea>
        <button id="btn-send" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>
  <script src="/mobile/app.js"></script>
</body>
</html>
